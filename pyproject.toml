[project]
name = "threadwright"
version = "0.1.0"
description = "A Slack bot that runs Claude Code on your own GCP VM"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-compute>=1.58.0",
    "google-cloud-pubsub>=2.44.0",
    "google-cloud-storage>=3.17.2",
    "slack-bolt>=1.21",
]

[project.scripts]
threadwright = "threadwright.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["threadwright.main", "threadwright.listener", "threadwright.worker", "threadwright.vm"]
disallow_untyped_calls = false
